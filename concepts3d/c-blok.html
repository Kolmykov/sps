<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPS · концепт C · Недостающий блок</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
/* Концепт C. Зелёный, как блок «Компания в цифрах» на старом сайте SPS. Компания = стена из блоков-должностей с пиктограммами.
   Слово в заголовке называет роль: блок с этой ролью уходит из стены, на его место SPS ставит новый с той же пиктограммой. */
:root{--g:#09CB2C;--ink:#141211;--paper:#F2F1EE;--pad:clamp(32px,3vw,56px)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--g);color:var(--ink);font-family:'Inter Tight',sans-serif;overflow:hidden}
.hero{position:relative;height:100vh;min-height:760px;max-height:1200px}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.hd{position:absolute;top:0;left:0;right:0;display:flex;gap:36px;align-items:center;padding:28px var(--pad);font-size:15px;z-index:2}
.hd b{font-size:22px;font-weight:800;margin-right:auto;display:flex;align-items:center;gap:6px}
.hd b i{display:inline-block;border-radius:50%;background:var(--ink)}
.hd a{color:inherit;text-decoration:none}
.tx{position:absolute;left:var(--pad);top:50%;transform:translateY(-46%);width:min(46vw,780px);z-index:2}
h1{font-weight:800;font-size:clamp(68px,6.8vw,132px);line-height:.98;letter-spacing:-.045em}
h1 .w{display:inline-block;transition:opacity .35s,transform .35s}
h1 .w.out{opacity:0;transform:translateY(.25em)}
.lead{margin-top:30px;font-size:clamp(18px,1.3vw,22px);line-height:1.4;max-width:26em}
.btn{display:inline-block;margin-top:32px;background:var(--ink);color:var(--paper);padding:20px 30px;font-size:18px;font-weight:500;text-decoration:none;border-radius:999px}
.cap{position:absolute;right:var(--pad);bottom:clamp(40px,6vh,80px);z-index:2;font:12px/1.5 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;text-align:right}
.cap b{display:block;font:500 15px 'JetBrains Mono',monospace;margin-top:4px;text-transform:none;letter-spacing:0}
</style></head><body>
<section class="hero">
<canvas id="c" aria-hidden="true"></canvas>
<header class="hd"><b><i style="width:7px;height:7px"></i><i style="width:10px;height:10px"></i><i style="width:13px;height:13px;background:var(--paper)"></i>&nbsp;SPS</b><a href="#">Услуги</a><a href="#">Стоимость</a><a href="#">Как&nbsp;работаем</a><a href="#">Ищу работу</a><a href="#">+7 473 229-65-44</a></header>
<div class="tx"><h1>Нужны<br><span class="w" id="w">менеджеры</span>?<br>Найдём.</h1><p class="lead">Подберём специалистов, выведем людей на&nbsp;смену, наладим уборку и&nbsp;кадры. Освободилось место, ставим нового человека мы.</p><a class="btn" href="#">Обсудить задачу</a></div>
<p class="cap" aria-live="polite">Ваша компания<b id="st">20 из 20 мест заняты</b></p>
</section>
<script src="three.min.js"></script>
<script>
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK='#141211',PAPER='#ECE9E3';
/* пиктограммы должностей, рисуем линией, как на старом сайте SPS */
const icons={
 manager(c){c.strokeRect(58,92,140,96);c.beginPath();c.moveTo(102,92);c.lineTo(102,70);c.lineTo(154,70);c.lineTo(154,92);c.moveTo(58,132);c.lineTo(198,132);c.stroke()},
 loader(c){c.beginPath();c.moveTo(128,56);c.lineTo(200,92);c.lineTo(200,170);c.lineTo(128,206);c.lineTo(56,170);c.lineTo(56,92);c.closePath();c.moveTo(56,92);c.lineTo(128,128);c.lineTo(200,92);c.moveTo(128,128);c.lineTo(128,206);c.moveTo(92,74);c.lineTo(164,110);c.stroke()},
 cleaner(c){c.beginPath();c.moveTo(70,104);c.lineTo(186,104);c.lineTo(170,200);c.lineTo(86,200);c.closePath();c.moveTo(70,104);c.bezierCurveTo(70,40,186,40,186,104);c.moveTo(96,140);c.lineTo(160,140);c.stroke()},
 expert(c){c.beginPath();c.moveTo(56,200);c.lineTo(200,200);c.moveTo(84,200);c.lineTo(84,150);c.moveTo(128,200);c.lineTo(128,110);c.moveTo(172,200);c.lineTo(172,70);c.stroke()},
 doc(c){c.beginPath();c.moveTo(78,52);c.lineTo(150,52);c.lineTo(180,82);c.lineTo(180,204);c.lineTo(78,204);c.closePath();c.moveTo(102,112);c.lineTo(156,112);c.moveTo(102,142);c.lineTo(156,142);c.moveTo(102,172);c.lineTo(136,172);c.stroke()},
 helmet(c){c.beginPath();c.moveTo(64,164);c.bezierCurveTo(64,70,192,70,192,164);c.moveTo(44,164);c.lineTo(212,164);c.moveTo(128,82);c.lineTo(128,118);c.stroke()},
 clock(c){c.beginPath();c.arc(128,128,74,0,6.29);c.moveTo(128,128);c.lineTo(128,84);c.moveTo(128,128);c.lineTo(160,146);c.stroke()},
 person(c){c.beginPath();c.arc(128,96,32,0,6.29);c.moveTo(64,206);c.bezierCurveTo(64,140,192,140,192,206);c.stroke()}
};
const ROLES=[['менеджеры','manager','менеджера'],['грузчики','loader','грузчика'],['уборщицы','cleaner','уборщицы'],['эксперты','expert','эксперта']];
const tex={};
function tx(name){if(tex[name])return tex[name];const cv=document.createElement('canvas');cv.width=cv.height=256;const c=cv.getContext('2d');
 c.fillStyle=PAPER;c.fillRect(0,0,256,256);c.strokeStyle=INK;c.lineWidth=11;c.lineCap=c.lineJoin='round';icons[name](c);
 const t=new THREE.CanvasTexture(cv);t.anisotropy=8;return tex[name]=t}
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(26,1,.1,200);
S.add(new THREE.HemisphereLight(0xffffff,0x6f8f74,.62));const sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(-6,9,12);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8});sun.shadow.mapSize.set(2048,2048);sun.shadow.radius=5;S.add(sun);
const G=new THREE.Group();G.rotation.y=-.68;G.rotation.x=.12;S.add(G);
const side=new THREE.MeshLambertMaterial({color:0xE2DFD8}),boxG=new THREE.BoxGeometry(.96,.96,.96);
function cube(name){const m=new THREE.Mesh(boxG,[side,side,side,side,new THREE.MeshLambertMaterial({map:tx(name)}),side]);m.castShadow=m.receiveShadow=true;m.userData.name=name;return m}
/* стена 5×4: роли встречаются по нескольку раз, остальное — другие должности */
const COLS=5,ROWS=4,layout=['manager','doc','loader','helmet','cleaner','loader','expert','person','manager','clock','cleaner','helmet','manager','loader','doc','person','expert','cleaner','clock','expert'];
const cells=[];
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const i=r*COLS+c,m=cube(layout[i]);const p=new THREE.Vector3((c-(COLS-1)/2)*1.04,((ROWS-1)/2-r)*1.04,0);m.position.copy(p);G.add(m);cells.push({p,m})}
const back=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.ShadowMaterial({opacity:.14}));back.position.z=-.5;back.receiveShadow=true;G.add(back);
function size(){const w=innerWidth,h=Math.min(Math.max(innerHeight,760),1200);R.setSize(w,h,false);cam.aspect=w/h;
 cam.position.set(0,0,17.5);cam.lookAt(0,0,0);cam.setViewOffset(w,h,-w*.25,0,w,h);cam.updateProjectionMatrix()}
size();addEventListener('resize',size);
const wEl=document.getElementById('w'),st=document.getElementById('st');
const ease=t=>1-Math.pow(1-t,3),back2=t=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
let ri=0,ph='hold',t0=0,cell=null,old=null,neo=null,lastCell=-1;
function startRole(now){const [word,name,gen]=ROLES[ri%ROLES.length];
 wEl.classList.add('out');setTimeout(()=>{wEl.textContent=word;wEl.classList.remove('out')},350);
 const opts=cells.map((c,i)=>i).filter(i=>cells[i].m.userData.name===name&&i!==lastCell);const i=opts[Math.floor(Math.random()*opts.length)];lastCell=i;
 cell=cells[i];old=cell.m;neo=cube(name);neo.visible=false;G.add(neo);ph='out';t0=now;st.textContent='Свободно место '+gen}
let mx=0,my=0,tX=0,tY=0;addEventListener('pointermove',e=>{tX=e.clientX/innerWidth-.5;tY=e.clientY/innerHeight-.5});
function tick(ms){const now=ms/1000,t=now-t0;
 if(ph==='hold'&&t>(ri===0?1:2.4))startRole(now);
 else if(ph==='out'){const k=Math.min(t/.8,1),e=ease(k);old.position.set(cell.p.x,cell.p.y,cell.p.z-e*1.6);old.scale.setScalar(1-e*.999);
  if(k>=1){G.remove(old);ph='gap';t0=now}}
 else if(ph==='gap'&&t>.6){ph='in';t0=now;neo.visible=true}
 else if(ph==='in'){const k=Math.min(t/1.15,1),e=back2(k),f=ease(k);
  neo.position.set(cell.p.x+(1-f)*1.2,cell.p.y+(1-f)*4.2,cell.p.z+(1-e)*4);neo.rotation.set((1-f)*-1.2,(1-f)*2.4,(1-f)*.6);
  if(k>=1){neo.position.copy(cell.p);neo.rotation.set(0,0,0);cell.m=neo;ph='hold';t0=now;ri++;st.textContent='20 из 20 мест заняты'}}
 mx+=(tX-mx)*.05;my+=(tY-my)*.05;G.rotation.y=-.68+mx*.14;G.rotation.x=.12+my*.06;
 R.render(S,cam);requestAnimationFrame(tick)}
if(RM){R.render(S,cam);addEventListener('resize',()=>R.render(S,cam))}else requestAnimationFrame(tick);
</script></body></html>
