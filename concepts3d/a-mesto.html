<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPS · концепт A · Свободное место</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
/* Концепт A. Светлый. Структура компании в изометрии: сотрудник уходит, место пустеет, SPS приводит замену, место становится зелёным.
   Зелёные места копятся: это инфографика «сколько мест закрыли мы». */
:root{--g:#09CB2C;--ink:#141211;--mute:#5a5753;--paper:#F2F1EE;--pad:clamp(32px,3vw,56px)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:'Inter Tight',sans-serif;overflow:hidden}
.hero{position:relative;height:100vh;min-height:760px;max-height:1200px}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.hd{position:absolute;top:0;left:0;right:0;display:flex;gap:36px;align-items:center;padding:28px var(--pad);font-size:15px;z-index:2}
.hd b{font-size:22px;font-weight:600;margin-right:auto;display:flex;align-items:center;gap:6px}
.hd b i{display:inline-block;border-radius:50%;background:var(--ink)}
.hd a{color:inherit;text-decoration:none}
.tx{position:absolute;left:var(--pad);bottom:clamp(56px,9vh,112px);width:min(44vw,720px);z-index:2}
h1{font-weight:600;font-size:clamp(64px,6.4vw,120px);line-height:.95;letter-spacing:-.035em}
.lead{margin-top:28px;font-size:clamp(18px,1.3vw,22px);line-height:1.4;max-width:28em;color:var(--mute)}
.btn{display:inline-block;margin-top:32px;background:var(--g);color:var(--ink);padding:20px 30px;font-size:18px;font-weight:500;text-decoration:none;border-radius:999px}
.lab{font:12px/1.5 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.cap{position:absolute;right:var(--pad);bottom:clamp(56px,9vh,112px);z-index:2;text-align:right;min-width:300px}
.cap .st{font-size:20px;font-weight:500;margin-top:8px;transition:opacity .3s}
.cap .n{font:500 14px 'JetBrains Mono',monospace;margin-top:16px}
.cap .n b{display:inline-block;width:12px;height:12px;background:var(--g);margin-right:8px;vertical-align:-1px}
</style></head><body>
<section class="hero">
<canvas id="c" aria-hidden="true"></canvas>
<header class="hd"><b><i style="width:7px;height:7px"></i><i style="width:10px;height:10px"></i><i style="width:13px;height:13px;background:var(--g)"></i>&nbsp;SPS</b><a href="#">Услуги</a><a href="#">Стоимость</a><a href="#">Как&nbsp;работаем</a><a href="#">Ищу работу</a><a href="#">+7 473 229-65-44</a></header>
<div class="tx"><h1>Нужны люди?<br>Найдём.</h1><p class="lead">Подберём специалистов, выведем людей на&nbsp;смену, наладим уборку и&nbsp;кадры. Если сотрудник уйдёт, замену ищем мы.</p><a class="btn" href="#">Обсудить задачу</a></div>
<div class="cap" aria-live="polite"><p class="lab">Ваша команда</p><p class="st" id="st">Все на&nbsp;местах</p><p class="n"><b></b>Замен от&nbsp;SPS: <span id="cnt">0</span></p></div>
</section>
<script src="three.min.js"></script>
<script>
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const S=new THREE.Scene();
const cam=new THREE.OrthographicCamera(-1,1,1,-1,.1,200);
cam.position.set(7,25,27);cam.lookAt(0,0,0);
S.add(new THREE.HemisphereLight(0xffffff,0xa9a49c,.78));
const sun=new THREE.DirectionalLight(0xffffff,.5);sun.position.set(-8,16,10);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14});sun.shadow.mapSize.set(2048,2048);sun.shadow.radius=6;S.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.ShadowMaterial({opacity:.13}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;S.add(ground);
const G=new THREE.Group();S.add(G);
const C={plinth:new THREE.Color(0xc9c6c0),green:new THREE.Color(0x09CB2C),ink:0x1f1d1b,bar:0xc4c0b9};
const matBar=new THREE.MeshLambertMaterial({color:C.bar}),matInk=new THREE.MeshLambertMaterial({color:C.ink});
/* структура: руководитель, 3 отдела, 6 сотрудников */
const slots=[{x:0,z:-3.4,l:0}];
[-3.4,0,3.4].forEach(x=>slots.push({x,z:-.6,l:1}));
[-4.25,-2.55,-.85,.85,2.55,4.25].forEach(x=>slots.push({x,z:2.2,l:2}));
const pg=new THREE.BoxGeometry(1.05,.18,1.05);
slots.forEach(s=>{s.m=new THREE.Mesh(pg,new THREE.MeshLambertMaterial({color:C.plinth.clone()}));s.m.position.set(s.x,.09,s.z);s.m.castShadow=s.m.receiveShadow=true;G.add(s.m)});
function bar(x1,z1,x2,z2){const w=Math.abs(x2-x1)+.07,d=Math.abs(z2-z1)+.07,b=new THREE.Mesh(new THREE.BoxGeometry(w,.03,d),matBar);b.position.set((x1+x2)/2,.015,(z1+z2)/2);b.receiveShadow=true;G.add(b)}
/* линии подчинения */
bar(0,-2.85,0,-2);bar(-3.4,-2,3.4,-2);[-3.4,0,3.4].forEach(x=>bar(x,-2,x,-1.15));
[[-3.4,[-4.25,-2.55]],[0,[-.85,.85]],[3.4,[2.55,4.25]]].forEach(([p,[a,b]])=>{bar(p,-.05,p,.8);bar(a,.8,b,.8);bar(a,.8,a,1.65);bar(b,.8,b,1.65)});
/* фигурка-пиктограмма: капсула и шар, как точки в логотипе SPS */
const bodyG=new THREE.CapsuleGeometry(.24,.34,8,20),headG=new THREE.SphereGeometry(.2,28,20);
function figure(){const f=new THREE.Group(),b=new THREE.Mesh(bodyG,matInk),h=new THREE.Mesh(headG,matInk);b.position.y=.42;h.position.y=1.06;b.castShadow=h.castShadow=true;f.add(b,h);return f}
slots.forEach(s=>{s.f=figure();s.f.position.set(s.x,.18,s.z);G.add(s.f)});
let walker=figure();walker.visible=false;G.add(walker);
/* камера: структура справа от текста */
function size(){const w=innerWidth,h=Math.min(Math.max(innerHeight,760),1200);R.setSize(w,h,false);
const F=19*Math.pow(1440/w,.35),Fh=F*h/w;cam.left=-F*.69;cam.right=F*.31;cam.top=Fh*.46;cam.bottom=-Fh*.54;cam.updateProjectionMatrix()}
size();addEventListener('resize',size);
/* сценарий */
const LANE=4.1,V=4.6,order=[5,2,8,4,9,1,6,3,7];
const st=document.getElementById('st'),cnt=document.getElementById('cnt');
function say(t){if(st.textContent!==t)st.textContent=t}
function path(pts){const seg=[];let L=0;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);seg.push({a,b,l,s:L});L+=l}return{seg,L,at(d){d=Math.max(0,Math.min(L,d));for(const q of seg)if(d<=q.s+q.l){const k=(d-q.s)/q.l;return[q.a[0]+(q.b[0]-q.a[0])*k,q.a[1]+(q.b[1]-q.a[1])*k]}const q=seg[seg.length-1];return q.b}}}
let k=0,phase='hold',t0=0,cur=null,out=null,inn=null,done=0,leaver=null;
function next(now){const s=slots[order[k%order.length]];cur=s;
 out=path([[s.x,s.z],[s.x,LANE],[16,LANE]]);inn=path([[16,LANE],[s.x,LANE],[s.x,s.z+.9]]);
 leaver=s.f;phase='leave';t0=now}
function reset(){slots.forEach(s=>{s.green=0;s.m.material.color.copy(C.plinth)});done=0;cnt.textContent=0}
function bob(f,t){f.children[0].position.y=.42+Math.abs(Math.sin(t*11))*.06;f.children[1].position.y=1.06+Math.abs(Math.sin(t*11))*.07}
let mx=0,my=0,tx=0,ty=0;addEventListener('pointermove',e=>{tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5});
function tick(ms){const now=ms/1000,t=now-t0;
 if(phase==='hold'&&t>(k===0?1.2:1.9)){if(k>0&&k%order.length===0){reset()}next(now)}
 else if(phase==='leave'){say('Сотрудник ушёл');const p=out.at(t*V);leaver.position.set(p[0],.18,p[1]);bob(leaver,now);if(t*V>=out.L){phase='empty';t0=now}}
 else if(phase==='empty'){say('Место свободно. Ищем замену');if(t>1.1){phase='arrive';t0=now;walker.visible=true;walker.scale.set(1,1,1)}}
 else if(phase==='arrive'){say('Замена в пути');const p=inn.at(t*V);walker.position.set(p[0],.18,p[1]);bob(walker,now);if(t*V>=inn.L){phase='hop';t0=now}}
 else if(phase==='hop'){const q=Math.min(t/.42,1),z=cur.z+.9*(1-q);walker.position.set(cur.x,.18*q+Math.sin(q*Math.PI)*.75,z);
  if(q>=1){phase='land';t0=now;
   /* пришедшая фигурка встаёт на место, ушедшая становится следующей «заменой» */
   cur.f=walker;leaver.visible=false;walker=leaver;done++;cnt.textContent=done}}
 else if(phase==='land'){const q=Math.min(t/.45,1);cur.m.material.color.copy(C.plinth).lerp(C.green,q);const sq=1-Math.sin(q*Math.PI)*.12;cur.f.scale.set(1/sq*.98+.02,sq,1/sq*.98+.02);
  if(q>=1){cur.f.scale.set(1,1,1);say('Место занято. Замену нашли мы');phase='hold';t0=now;k++}}
 mx+=(tx-mx)*.05;my+=(ty-my)*.05;G.rotation.y=mx*.12;G.rotation.x=my*.03;
 R.render(S,cam);if(!RM)requestAnimationFrame(tick)}
if(RM){[5,2,8,4].forEach(i=>slots[i].m.material.color.copy(C.green));cnt.textContent=4;say('Место занято. Замену нашли мы');R.render(S,cam);addEventListener('resize',()=>R.render(S,cam))}
else requestAnimationFrame(tick);
</script></body></html>
